<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2320"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd257"/>
      <stop offset="55%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#d07d00"/>
    </linearGradient>
    <!-- Keeps the foam blobs from spilling outside the glass silhouette. -->
    <clipPath id="glass">
      <rect x="132" y="150" width="182" height="238" rx="22"/>
    </clipPath>
  </defs>

  <!-- id="backdrop": only the Play icon and the maskable PWA icon keep it.
       Everything else is rendered without, so the beer mat stands on the
       home screen or the browser tab by itself. -->
  <rect id="backdrop" width="512" height="512" fill="url(#bg)"/>

  <!-- The Bierdeckel: a round beer mat with a printed ring. On Android the
       mat is the adaptive icon's background layer instead (gen-assets.mjs),
       so the launcher's own mask gives it its shape. -->
  <circle id="mat" cx="256" cy="256" r="226" fill="#f4ece0"/>
  <circle id="ring" cx="256" cy="256" r="198" fill="none" stroke="#d07d00" stroke-width="8"/>

  <!-- The mug, centred on the mat with room around it. Its edge is the
       mat's amber: cream would vanish against the cream mat. -->
  <g transform="translate(256 256) scale(0.74) translate(-266 -269)">
    <!-- handle, drawn behind the body -->
    <path d="M312 214h34a54 54 0 0 1 0 108h-34"
          fill="none" stroke="#d07d00" stroke-width="26" stroke-linejoin="round"/>

    <!-- glass body -->
    <rect x="132" y="150" width="182" height="238" rx="22" fill="url(#beer)"/>

    <!-- foam: blobs clipped to the glass, then a flat band to hide the seams -->
    <g clip-path="url(#glass)">
      <rect x="132" y="150" width="182" height="66" fill="#fff6e0"/>
      <circle cx="168" cy="206" r="30" fill="#fff6e0"/>
      <circle cx="226" cy="212" r="34" fill="#fff6e0"/>
      <circle cx="284" cy="206" r="28" fill="#fff6e0"/>
    </g>

    <!-- glass outline + highlight -->
    <rect x="132" y="150" width="182" height="238" rx="22"
          fill="none" stroke="#d07d00" stroke-width="20"/>
    <rect x="170" y="250" width="20" height="104" rx="10" fill="#fff6e0" opacity="0.45"/>
  </g>

  <!-- The waiter's pencil marks, scribbled across the glass's corner at a
       slant: four strokes and the fifth across them. -->
  <g transform="translate(330 350) rotate(-18) skewX(-12) scale(0.8)">
    <line x1="-64.0" y1="-59.0" x2="-56.0" y2="59.0" stroke="#2a2320" stroke-width="15" stroke-linecap="round"/>
    <line x1="-17.0" y1="-59.0" x2="-23.0" y2="59.0" stroke="#2a2320" stroke-width="15" stroke-linecap="round"/>
    <line x1="18.0" y1="-59.0" x2="22.0" y2="59.0" stroke="#2a2320" stroke-width="15" stroke-linecap="round"/>
    <line x1="64.0" y1="-59.0" x2="56.0" y2="59.0" stroke="#2a2320" stroke-width="15" stroke-linecap="round"/>
    <line x1="-90.0" y1="35.4" x2="90.0" y2="-40.120000000000005" stroke="#2a2320" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
