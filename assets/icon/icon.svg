<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2320"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd257"/>
      <stop offset="55%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#d07d00"/>
    </linearGradient>
    <!-- Keeps the foam blobs from spilling outside the glass silhouette. -->
    <clipPath id="glass">
      <rect x="132" y="150" width="182" height="238" rx="22"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- handle, drawn behind the body -->
  <path d="M312 214h34a54 54 0 0 1 0 108h-34"
        fill="none" stroke="#f4ece0" stroke-width="26" stroke-linejoin="round"/>

  <!-- glass body -->
  <rect x="132" y="150" width="182" height="238" rx="22" fill="url(#beer)"/>

  <!-- foam: blobs clipped to the glass, then a flat band to hide the seams -->
  <g clip-path="url(#glass)">
    <rect x="132" y="150" width="182" height="66" fill="#fff6e0"/>
    <circle cx="168" cy="206" r="30" fill="#fff6e0"/>
    <circle cx="226" cy="212" r="34" fill="#fff6e0"/>
    <circle cx="284" cy="206" r="28" fill="#fff6e0"/>
  </g>

  <!-- glass outline + highlight -->
  <rect x="132" y="150" width="182" height="238" rx="22"
        fill="none" stroke="#f4ece0" stroke-width="20"/>
  <rect x="170" y="250" width="20" height="104" rx="10" fill="#fff6e0" opacity="0.45"/>
</svg>
