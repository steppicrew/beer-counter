<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd257"/>
      <stop offset="55%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#d07d00"/>
    </linearGradient>
    <!-- Keeps the foam blobs from spilling outside the glass silhouette. -->
    <clipPath id="glass">
      <rect x="132" y="150" width="182" height="238" rx="22"/>
    </clipPath>
    <!-- Pencil on cardboard: the graphite's edge breaks up a little. -->
    <filter id="pencil" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- id="backdrop": the mat filling the whole square, for the icons that
       must be opaque — the Play icon and the maskable PWA icon, whose corners
       Play and Android round themselves. Everything else is rendered without
       it, so the round mat stands on its own. -->
  <rect id="backdrop" width="512" height="512" fill="#f4ece0"/>

  <!-- The Bierdeckel: a round beer mat with a printed ring. On Android the
       mat is the adaptive icon's background layer instead (gen-assets.mjs),
       so the launcher's own mask gives it its shape. -->
  <circle id="mat" cx="256" cy="256" r="226" fill="#f4ece0"/>
  <circle id="ring" cx="256" cy="256" r="198" fill="none" stroke="#d07d00" stroke-width="8"/>

  <!-- The mug, centred on the mat with room around it. Its edge is the
       mat's amber: cream would vanish against the cream mat. -->
  <g transform="translate(256 256) scale(0.74) translate(-266 -269)">
    <!-- handle, drawn behind the body -->
    <path d="M312 214h34a54 54 0 0 1 0 108h-34"
          fill="none" stroke="#d07d00" stroke-width="26" stroke-linejoin="round"/>

    <!-- glass body -->
    <rect x="132" y="150" width="182" height="238" rx="22" fill="url(#beer)"/>

    <!-- foam: blobs clipped to the glass, then a flat band to hide the seams -->
    <g clip-path="url(#glass)">
      <rect x="132" y="150" width="182" height="66" fill="#fff6e0"/>
      <circle cx="168" cy="206" r="30" fill="#fff6e0"/>
      <circle cx="226" cy="212" r="34" fill="#fff6e0"/>
      <circle cx="284" cy="206" r="28" fill="#fff6e0"/>
    </g>

    <!-- glass outline + highlight -->
    <rect x="132" y="150" width="182" height="238" rx="22"
          fill="none" stroke="#d07d00" stroke-width="20"/>
    <rect x="170" y="250" width="20" height="104" rx="10" fill="#fff6e0" opacity="0.45"/>
  </g>

  <!-- The waiter's pencil marks, scribbled across the glass's corner at a
       slant: four strokes and the fifth across them, drawn by hand — each
       mark slightly bowed, its own length and lean, a flick where the
       pencil lifts; gone over twice, edges roughened like graphite on card. -->
  <g transform="translate(330 350) rotate(-18) skewX(-12) scale(0.8)" filter="url(#pencil)">
    <path d="M-63.0 -57.0Q-64.0 0.7 -57.0 58.0q1.5 -2.0 3.0 -4.0" fill="none" stroke="#3e4045" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M-62.5 -54.0Q-59.5 1.1 -55.0 56.0q0.0 0.0 0.0 0.0" fill="none" stroke="#3e4045" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M-19.0 -62.0Q-17.5 -3.4 -22.0 55.0q-1.0 -2.5 -2.0 -5.0" fill="none" stroke="#3e4045" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M-18.5 -59.0Q-13.0 -2.9 -20.0 53.0q0.0 0.0 0.0 0.0" fill="none" stroke="#3e4045" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M17.0 -55.0Q15.0 3.3 23.0 61.0q2.0 -1.5 4.0 -3.0" fill="none" stroke="#3e4045" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M17.5 -52.0Q19.5 3.6 25.0 59.0q0.0 0.0 0.0 0.0" fill="none" stroke="#3e4045" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M62.0 -60.0Q62.5 -1.8 55.0 56.0q-1.5 -2.5 -3.0 -5.0" fill="none" stroke="#3e4045" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M62.5 -57.0Q67.0 -1.1 57.0 54.0q0.0 0.0 0.0 0.0" fill="none" stroke="#3e4045" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M-92.0 38.0Q3.1 7.5 93.0 -36.0q3.0 1.5 6.0 3.0" fill="none" stroke="#3e4045" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M-91.5 41.0Q4.3 5.6 95.0 -38.0q0.0 0.0 0.0 0.0" fill="none" stroke="#3e4045" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
